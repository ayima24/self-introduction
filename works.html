<font size="4" color="#8C6239"><b>展示作品（一部紹介）</b></font>
<hr size="2" color="#8C6239">

<p>SNS利用前・中・後に感じることを、糸を紡ぐなどのアナログな身体感覚を通して可視化していく試みです。</p>

<ul>
  <li><b>① Wellbeingバランス天秤</b><br>
  理想と現実のエネルギー配分をハンガーとバケツを用いて可視化し、生活のバランスを再考する天秤です。<br><br></li>
  
  <li><b>② ドゥームスクロール追体験BOX</b><br>
  無意識に画面をスクロールし続けてしまう状態を、閉鎖的な箱の中で身体的・精神的に追体験する装置です。<br><br></li>
  
  <li><b>③ SNS共感度共有アートボード</b><br>
  SNSに伴う感情を「糸を結ぶ」という物理行為で可視化し、他者の内面と孤立感を共有し合うボードです。</li>
</ul>
